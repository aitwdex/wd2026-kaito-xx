<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Viewer</title>

    <!-- Bootstrap -->
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">World Weather Viewer</h1>

    <div class="card p-4 shadow">

        <div class="mb-3">

            <label class="form-label">都市を選択</label>

            <select id="citySelect" class="form-select">
                <option value="tokyo">東京</option>
                <option value="london">ロンドン</option>
                <option value="newyork">ニューヨーク</option>
                <option value="paris">パリ</option>
            </select>
        
        </div>

        <button id="weatherBtn" class="btn btn-primary">
            天気を取得
        </button>

        <div id="result" class="mt-4">
            ここに天気情報が表示されます
        </div>
    
    </div>
</div>

<footer class="text-center mt-5 mb-3">

    <small>
        Weather data by
        <a href="https://open-meteo.com/" target="_blank">
            Open-Meteo.com
        </a>
        （CC BY 4.0）
    </small>
</footer>

<!-- ESモジュールとして読み込む -->
<script type="module" src="./js/main.js"></script>

</body>

</html>
